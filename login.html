<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود | Auto 8</title>
  <link rel="icon" type="image/png" href="assets/images/logoo.png" />


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles/login.css">
</head>
<body>
  <section class="login-page d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          <div class="brand-wrap">
            <a href="#" class="brand-logo">AUTO <span>8</span></a>
            <div class="brand-subtitle">ورود به حساب کاربری Auto 8</div>
          </div>

          <div class="login-card">
            <div class="login-card-body">
              <h1 class="login-title">ورود</h1>
              <p class="login-text">
                لطفاً آدرس ایمیل یا شماره تلفن همراه خود را وارد کنید تا وارد حساب کاربری‌تان شوید.
              </p>

              <form>
                <div class="mb-3">
                  <label for="userField" class="form-label">ایمیل یا شماره موبایل</label>
                  <input
                    type="text"
                    class="form-control"
                    id="userField"
                    placeholder="مثلاً example@gmail.com"
                  />
                </div>

                <div class="mb-4 form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" />
                  <label class="form-check-label" for="rememberMe">
                    مرا به خاطر بسپار
                  </label>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-login">
                    ادامه
                  </button>
                </div>
              </form>

              <div class="login-links">
                حساب کاربری ندارید؟
                <a href="#">ثبت‌نام</a>
              </div>
            </div>
          </div>

          <div class="legal-text">
            با ورود به حساب، شرایط استفاده و حریم خصوصی Auto 8 را می‌پذیرید.
          </div>
        </div>
      </div>
    </div>
  </section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
